name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Generate version.json
      run: |
        VERSION="${GITHUB_SHA:0:7}"
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
        echo "{\"version\": \"$VERSION\", \"buildDate\": \"$BUILD_DATE\"}" > Pod2Blog.Web/wwwroot/version.json
        cat Pod2Blog.Web/wwwroot/version.json

    - name: Restore dependencies
      run: dotnet restore Pod2Blog.Web/Pod2Blog.Web.csproj

    - name: Publish
      run: dotnet publish Pod2Blog.Web/Pod2Blog.Web.csproj -c Release -o release --nologo

    - name: Change base-tag in index.html
      run: |
        sed -i 's/<base href="\/" \/>/<base href="\/Pod2Blog\/" \/>/g' release/wwwroot/index.html
        
    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    - name: Copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: release/wwwroot
        branch: gh-pages
